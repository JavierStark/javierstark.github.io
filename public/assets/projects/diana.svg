    <!-- pooled positives: row and column intersections -->
    <g fill="#ed4d6d"><circle cx="155" cy="80" r="13"/><circle cx="155" cy="185" r="13"/><circle cx="330" cy="80" r="13"/><circle cx="330" cy="220" r="13"/></g>
    <g fill="#7c83ff"><circle cx="85" cy="150" r="13"/><circle cx="260" cy="150" r="13"/><circle cx="400" cy="255" r="13"/></g>
