<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Diana: guide RNA design and pooled plate screening</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14152c"/><stop offset="1" stop-color="#1d1440"/>
    </linearGradient>
    <linearGradient id="strand" x1="0" x2="1">
