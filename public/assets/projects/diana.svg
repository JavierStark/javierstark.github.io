  <text x="540" y="200" fill="#ed4d6d" font-family="Space Grotesk, Inter, sans-serif" font-size="30" font-weight="700" text-anchor="middle">spacer · 28 nt</text>
  <text x="510" y="490" fill="#c9cbe0" font-family="ui-monospace, Consolas, monospace" font-size="30" letter-spacing="6" text-anchor="middle">GAUUUAGACUACCCC…</text>

  <!-- ranked candidates -->
  <g font-family="Inter, sans-serif" font-size="24" fill="#c9cbe0">
